<section class="py-5 bev-section bev-section-dark">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="bev-section-title bev-section-title-left">Nuestros autores</h2>

      <div class="bev-section-line"></div>
    </div>

    <div class="bev-authors-grid">
      <div class="row g-4 justify-content-center">
  {% for autor in autores %}
    <!-- Usamos col-12 en móviles y col-lg-6 en pantallas grandes (2 autores por fila) -->
    <div class="col-12 col-lg-6">
      <div class="bev-author-card">
        
        <!-- Fotografía del autor (Superpuesta a la izquierda) -->
        <div class="bev-author-img-container">
          <a href="{% url 'catalogo:detalle_autor' autor.id %}">
            {% if autor.foto %}
              <img src="{{ autor.foto.url }}" alt="{{ autor.nombre }}" loading="lazy" class="bev-author-img">
            {% else %}
              <div class="bev-avatar-fallback">
                {{ autor.obtener_iniciales }}
              </div>
            {% endif %}
          </a>
        </div>

        <!-- Recuadro blanco de información (Fondo a la derecha) -->
        <div class="bev-author-info-box">
          <span class="bev-author-country-badge">{{ autor.nacionalidad }}</span>
          <h3 class="bev-author-name-title">{{ autor.nombre }}</h3>
          
          <div class="mt-3">
            <a href="{% url 'catalogo:detalle_autor' autor.id %}" class="btn bev-btn-autor" data-bs-theme="light">
              <i class="bi bi-plus-circle me-1"></i> Ver sus obras
            </a>
          </div>
        </div>

      </div>
    </div>
  {% endfor %}
</div>
    </div>
  </div>
</section>
