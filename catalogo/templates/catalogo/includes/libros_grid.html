<div class="libros-main">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 g-lg-4" id="librosGrid">
    {% for libro in libros %}
      <article
        class="col libro-item"
        data-etiqueta="{{ libro.etiqueta|lower }}"
        data-genero="{{ libro.genero|lower }}"
      >
        {% include "catalogo/includes/libro_card.html" %}
      </article>
    {% endfor %}
  </div>
</div>
